schema_version: 1
phase_id: porting
owner_notes:
  - "Synthesized all five upstream artifacts into a self-sufficient bundle. No new source reading was needed beyond confirming the four decisions, which is the compression boundary working as intended."
  - "All 41 defects (4 high, 16 medium, 21 low) carry a disposition and a required design consequence; each high finding also carries a sketched acceptance test, per the deep-audit guidance that a hazard without a test gets reintroduced."
  - "Two structural conclusions drive the rewrite. The system has no notion of partial success - one decision that generates D2.1, D2.2, and half of D2.3's cost. And absent bounds are systemic: no job timeout, output cap, input cap, queue bound, per-drain budget, or free-space check."
  - "The bundle leads with a caveat that shapes how it should be trusted: the specification is two-tier. The 1,069-line service suite passes and its contracts are verified; the ~470 lines of GUI suites error at collection, so 14 of 42 acceptance rows are asserted-not-verified. The GUI is simultaneously the only interactive surface and the least-evidenced half of the spec."
  - "Decision 4 is new relative to the previous run: two acceptance scenarios (41, 42) describe behavior the implementation demonstrably FAILS, both found by execution. They must reach the spec as MUST rules, not observations, because a faithful port would otherwise reproduce both."
  - "Deliberately did NOT reproduce the 42 acceptance scenarios or the full event/state tables. They are named in the Source Index with explicit deep-read triggers and routed as porting-CF3, which also requires carrying the verification-status column forward per convention C04."
open_questions: []
carry_forward:
  - id: porting-CF1
    kind: defer-to-phase
    target_phase: reimplementation-spec
    description: "The 4 high and 16 medium defects each carry a required design consequence, and the high ones a sketched acceptance test, in the Defect Synthesis section. Each must become a normative rule plus a concrete black-box scenario in the spec, not a summary."
    deferred_reason: "The deep-audit guidance is explicit that a hazard with no test in the spec gets reintroduced by whoever implements it. Turning design consequences into normative rules with scenarios is the spec phase's rubric, not synthesis."
  - id: porting-CF2
    kind: defer-to-phase
    target_phase: reimplementation-spec
    description: "Decisions 1-4 are made but not specified: break the all-or-nothing contract while preserving the no-corrupt-output half; fix the progress formula and rewrite its tests; extend the event schema and state machine together for cancellation/retry/concurrency; and carry acceptance rows 41 and 42 as MUST rules. Each needs exact normative wording, the enumerated test changes, and a build-order placement."
    deferred_reason: "The decisions belong to synthesis; their precise wording, the list of tests they change, and their sequencing belong to the spec."
  - id: porting-CF3
    kind: defer-to-phase
    target_phase: reimplementation-spec
    description: "This bundle omits the 42 black-box acceptance scenarios and the full nine-event payload schema and 22-transition state machine, pointing at them via the Source Index instead. The spec must fold the acceptance list into its own acceptance section, carrying the verification-status column forward per convention C04, and pin the event contract concretely."
    deferred_reason: "Named in the Source Index as the two deep-read triggers. Reproducing them in the bundle would defeat the compression boundary; the spec is where they become normative - and dropping the status column would hand the implementer a harness whose weak rows look like its strong ones."
carry_forward_closures:
  - contracts-CF1
  - contracts-CF2
  - contracts-CF4
  - protocols-CF1
open_question_closures: []
post_pipeline:
  - id: pp-run-gui-suites
    description: "Run the five GUI test suites on a host with tkinter and a display to resolve q-gui-tests-ever-run. They error at collection here, so it is established they cannot have passed headless; whether they pass anywhere is unknown. Determines how far the 14 asserted-not-verified acceptance rows can be trusted."
  - id: pp-fix-gui-skip-guard
    description: "Fix the headless-skip guard in the five GUI suites (D1.6): guard the import with importlib.util.find_spec('tkinter') plus a module-level skipUnless, or move 'import app' inside the existing try in setUp. Independent of any port and worth doing in the Python codebase directly - it is what hid ~470 lines of unverified contracts."
  - id: pp-measure-queue-depth
    description: "Measure steady-state event-queue depth against a real GPU-backed model on a multi-page document to resolve q-queue-depth-under-load, which decides how urgently a port needs bounded channels (D2.5, S3.2)."
  - id: pp-prompt-provenance
    description: "Ask the maintainer to record how SYSTEM_PROMPT was derived and against which models it was tuned (q-prompt-provenance). A port cannot tell which clauses are load-bearing, and it is the highest-leverage setting in the system."
  - id: pp-defect-fix-tracker
    description: "If the defects are fixed in the existing Python codebase rather than in a port, instantiate templates/defect-fix-tracker.md with the 41 IDs from the two scan reports to log each fix, deferral, or acceptance."
decisions:
  - id: porting-D1
    description: "Closed contracts-CF1 by splitting the invariant the two passing tests conflate rather than choosing between the defect finding and the contract. Preserve 'never leave a corrupt or partial file at the destination, and never destroy existing output except on a successful complete write'; drop 'discard all completed work when any page fails'. Writing partial results to a separate clearly-named artifact satisfies both and requires rewording only one test."
  - id: porting-D2
    description: "Closed contracts-CF2 by fixing the progress formula and rewriting the three progress tests. The cost is lower than it first appeared: these are GUI-suite tests that error at collection headlessly, so they are very likely not passing anywhere in CI, and rewriting them forfeits little."
  - id: porting-D3
    description: "Closed protocols-CF1 by treating cancellation, per-page retry, concurrent recognition, and resume as one design change rather than four, because each needs the same missing primitives: a job identifier, a monotonic sequence number, a CANCELLING state, and an error state. Specified them as prerequisites rather than letting each feature invent its own."
  - id: porting-D4
    description: "Closed contracts-CF4 by promoting acceptance rows 41 and 42 to MUST rules for the spec. Row 42 is unusual in constraining the port's own test harness rather than its runtime behavior; kept anyway, because the defect it encodes is what hid ~470 lines of unverified contracts."
  - id: porting-D5
    description: "Did not append to the three written secondary outputs at porting level, and confirmed build-and-deploy and config-model remain deliberately unwritten across the whole run. The synthesis view belongs in this bundle, which is the compression boundary those files would otherwise duplicate. Accounted for in Coverage and limits per the v0.16.0 orchestrator duty."
  - id: porting-D6
    description: "Used concept names (settings registry, conversion engine, presentation shell, entrypoint) per the skill's instruction to prefer concepts over source names, while keeping the file mapping visible so the bundle stays traceable."
closeout_summary: "Bundle synthesized as the compression boundary; 41 defects dispositioned; four tradeoff decisions settled."
closeout_content: |-
  # Closeout — porting

  ## Summary

  - Synthesized all five upstream artifacts into a self-sufficient
    reverse-engineering bundle: system summary, concept-named layer map,
    19-feature contract table sorted by porting priority, protocol and state
    notes, 15 consolidated hazards, and a full defect synthesis.
  - Assigned a disposition and a **required design consequence** to all 41
    defects, with a sketched acceptance test for each of the four high findings.
  - Closed `contracts-CF1`, `contracts-CF2`, `contracts-CF4`, and
    `protocols-CF1` with explicit decisions rather than deferrals.

  ## The four decisions

  **1. Break the all-or-nothing contract — deliberately.** Two *passing*
  service-suite tests assert that a mid-run failure discards all recognized
  pages. Rather than choosing between the tests and D2.1, the invariant they
  conflate splits cleanly: **preserve** "never leave a corrupt or partial file
  at the destination, and never destroy existing output except on a successful
  complete write"; **drop** "discard all completed work when any page fails,"
  which protects nothing and is merely a side effect of saving once at the end.
  Writing partial results to a separate, clearly-named artifact satisfies both;
  only one test needs rewording.

  **2. Fix the progress formula, rewrite the tests.** Nothing external depends
  on it, and the behavior makes a working app look hung. Cheaper than it looked:
  the tests in question are GUI-suite tests that error at collection headlessly.

  **3. Extend the event schema and state machine together.** Cancellation,
  per-page retry, concurrent recognition, and resume all need the same four
  missing primitives — job identifier, monotonic sequence number, a CANCELLING
  state, and an error state. Adding any one without them reintroduces the races
  this design avoids only by being strictly sequential.

  **4. Carry the two known-failing scenarios as MUST rules.** Of 42 acceptance
  scenarios, exactly two describe behavior the implementation *demonstrably
  fails*, both found by execution: row 41 (quitting mid-run must not leak the
  render directory — proven by probe) and row 42 (a headless test run must not
  produce collection errors — measured). A faithful port would reproduce both.

  ## The caveat the bundle leads with

  The specification is **two-tier**, and the bundle says so up front rather than
  averaging it away. The service suite passes, so its contracts are verified.
  The GUI suites error at collection, so 14 of the 42 acceptance rows are
  `asserted-not-verified`. The GUI is simultaneously the only interactive
  surface and the least-evidenced half of the spec — worth knowing before
  trusting it as a parity harness.

  ## Compression boundary

  Two things are deliberately omitted and named in the Source Index with
  explicit triggers: the 42 acceptance scenarios and the full event/state
  tables. Routed as `porting-CF3`, which also requires the spec carry the
  verification-status column forward (convention C04). Everything else
  load-bearing is inline, so the spec can start from this one artifact.

  ## Post-pipeline work opened

  Five items, led by two that are worth doing regardless of whether a port
  happens: `pp-fix-gui-skip-guard` (fix the guard that hid ~470 lines of
  unverified contracts) and `pp-run-gui-suites` (establish whether they pass
  anywhere). Plus `pp-measure-queue-depth`, `pp-prompt-provenance`, and
  `pp-defect-fix-tracker`.
