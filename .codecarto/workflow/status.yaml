project_name: Local-OCR
pipeline: workflow/pipeline-full-with-deep-audit.yaml
current_phase: complete
last_updated: "2026-08-18T03:27:15.032Z"
schema_version: 1
phases:
  architecture:
    status: complete
    owner_notes:
      - "Completed via codecarto_complete."
      - "Primary output: .codecarto/findings/architecture/architecture-map.md"
      - "Validation: PASS"
      - "Four first-party modules in a strict acyclic stack: main.py -> app.py -> ocr_service.py -> config.py. config.py contains no import statement at all and is the stable base."
      - "The Tk boundary is the load-bearing architectural line, and this run VERIFIED it by execution rather than inferring it: with no tkinter module present on the host, the 1,069-line service suite ran 72 passed / 1 skipped / 0 failures. That upgrades the docstring's claim to observed fact. The rule is still enforced only by convention - no import lint asserts it - so it can regress silently."
      - "Exactly one cross-thread channel: an unbounded queue.Queue of (kind, payload) tuples. Workers only put, the Tk main thread only drains, every 50ms. No locks anywhere; mutual exclusion is an OperationState enum checked on the main thread."
      - "Running the suite also surfaced a defect the previous reading missed: the five GUI test files document that they skip on a headless host, but their skip guard is in setUp while 'import app' is at module scope, so without tkinter they ERROR (5 errors) instead of skipping. Routed as arch-CF6."
      - "No persistence beyond the output .md: no config file, no env vars, no saved preferences. URL/model/DPI reset on every launch."
    outputs_present:
      - findings/architecture/architecture-map.md
    open_questions:
      -
        id: q-test-invocation
        kind: needs-maintainer-decision
        description: "RE-TRIAGED this run and narrowed. 'python3 -m unittest tests.test_ocr_service' is now confirmed working (72 passed). What remains unknown is only the project's intended runner: .gitignore references .pytest_cache/ while the tests are written against unittest, and no runner config is committed."
        deferred_reason: "The residue is a maintainer convention rather than a code fact, and it now blocks nothing because a working command is established. Retained only so the port's CI setup records the ambiguity."
    carry_forward: []
  defect-scan-mechanical:
    status: complete
    owner_notes:
      - "Completed via codecarto_complete."
      - "Primary output: .codecarto/findings/defect-scan-mechanical/mechanical-defects.md"
      - "Validation: PASS"
      - "23 findings across passes 1/2/6: 0 critical, 3 high, 8 medium, 12 low. Nothing produces silently wrong OCR output or corrupts user data in normal operation."
      - "All three high findings share one root cause: the OCR pipeline is a single all-or-nothing transaction over N independent network calls. One bad page (D2.1), one blank page (D2.2), or one mid-job quit (D2.3) discards everything already recognized. This is the most important thing for porting to redesign."
      - "D2.3 is now observed fact, not inference. Per convention C01 the mechanism was isolated and executed: a daemon thread with mkdtemp + finally:rmtree, main thread returning after 0.4s. On Python 3.11 the finally did NOT run and the temp directory SURVIVED. q-shutdown-tempdir is closed."
      - "D1.6 is new and only findable by execution: all five GUI suites document that they skip on a headless host, but the skip guard is in setUp while 'import app' is at module scope, so without tkinter they error at collection. unittest discover reports 5 errors while the service suite passes 72. Those ~470 lines of UI contracts have very likely never run."
      - "D6.2 is tempered by measurement rather than confirmed: the suite passes on PyMuPDF 1.28.2 and Pillow 11.3.0, far above the declared floor, and the installed ollama client still exposes the shapes the getattr chains read. The uncapped-dependency exposure is real but currently unrealized."
      - "Error handling is otherwise deliberate and well-commented - the finally-reschedule in drain_ui_events, the non-fatal thumbnail failure, and the single-terminal-event sequencing are all correct and intentional. The gaps are at the edges of good patterns, not a general absence of care."
    outputs_present:
      - findings/defect-scan-mechanical/mechanical-defects.md
    open_questions: []
    carry_forward: []
  contracts:
    status: complete
    owner_notes:
      - "Completed via codecarto_complete."
      - "Primary output: .codecarto/findings/contracts/behavioral-contracts.md"
      - "Validation: PASS"
      - "13 feature contracts across three surfaces and a 42-scenario black-box acceptance list, recovered largely from the ~1,540 lines of tests. The tests, not the README, are the specification."
      - "The decisive framing this run is TWO-TIER EVIDENCE, per convention C02. The service suite (1,069 lines) was executed and passes 72/1-skipped, so contracts it pins are observed fact. The five GUI suites (~470 lines) error at collection without tkinter (D1.6), so every contract resting only on them is marked asserted-not-verified. 14 of 42 acceptance rows are in that weaker tier, all UI-side."
      - "The most consequential contract is VERIFIED: the OCR run is an all-or-nothing transaction. test_late_page_failure_leaves_no_new_output and test_late_page_failure_preserves_existing_output are both service-suite tests and both pass, so a port adding partial saves breaks passing tests rather than fixing an oversight."
      - "Two acceptance rows are new this run and are the only two the current implementation demonstrably fails: row 41 (quitting mid-run must not leak the render directory - proven failing by probe) and row 42 (a headless test run must not produce collection errors - measured failing). Both came from execution, not reading."
      - "There is no auth model at all, and no configuration surface: config.py constants are the single source, with no file, no env vars, and no persistence of URL/model/DPI."
      - "SYSTEM_PROMPT is the highest-leverage setting in the system and the least reachable - hardcoded, asserted verbatim by a passing test, and undocumented as to provenance."
    outputs_present:
      - findings/contracts/behavioral-contracts.md
    open_questions: []
    carry_forward: []
  protocols:
    status: complete
    owner_notes:
      - "Completed via codecarto_complete."
      - "Primary output: .codecarto/findings/protocols/protocols-and-state.md"
      - "Validation: PASS"
      - "Six protocol boundaries formalized with the nine required fields each, plus a nine-event payload catalog and four state machines. Configuration is explicitly NOT a boundary - config.py is imported directly with no serialization, precedence, or reload path."
      - "RESOLVED the previous run's largest unknown, per convention C01. Page images are passed to the client as path strings; the client's Image.serialize_model reads the file and base64-encodes it into the JSON body. Exercised directly: model_dump() returns a str beginning iVBORw0KGgo with the path absent. So the wire format is base64 bytes, a remote server never sees the path, and there is no path-passing shortcut for a port."
      - "That same inspection produced hazard H14: the client raises a LOCAL ValueError('File ... does not exist') for a missing render, from inside the app's remote-error wrapper, so a filesystem problem is reported as 'Ollama request failed (model x)'. This is the live form of the misattribution convention C03 exists to prevent."
      - "The most useful protocol property: B1 events split three ways. Observational events drive UI only - the saved Markdown comes from recognize_images' return value, not the event stream, so losing all of them still produces a byte-identical file. Only four events are state-bearing, and losing one strands the state machine permanently."
      - "SM1 has no cancellation transition and no error state. The missing error state is why the app can never offer retry: it keeps no memory of the last outcome."
      - "Per C02/C04, SM2/SM3/SM4 are marked asserted-not-verified because they are pinned only by the GUI suites, which error at collection here. This is the weakest-evidenced part of the protocol description and is stated rather than averaged away."
    outputs_present:
      - findings/protocols/protocols-and-state.md
    open_questions: []
    carry_forward: []
  defect-scan-semantic:
    status: complete
    owner_notes:
      - "Completed via codecarto_complete."
      - "Primary output: .codecarto/findings/defect-scan-semantic/semantic-defects.md"
      - "Validation: PASS"
      - "18 findings across passes 3/4/5: 0 critical, 1 high, 8 medium, 9 low. Combined with the mechanical scan the full audit is 41 findings: 0 critical, 4 high, 16 medium, 21 low."
      - "All seven routed carry-forwards resolved, none re-routed. One refuted (mech-CF3) and one downgraded on evidence (protocols-CF2 to medium)."
      - "The contradiction sweep changed a headline finding rather than being smoothed over. The previous pass rated provider-drift high partly because it was 'reachable today through ordinary dependency resolution'. The protocols phase then measured that the installed client still exposes ChatResponse.message.content and ListResponse.models[].model, contradicting that premise. S5.1 is now medium, with the reasoning stated. Downgrading on evidence beat preserving a headline."
      - "mech-CF3 refuted: enumerating every operation_state and self.closing access site shows all reads and writes are on the Tk main thread; workers touch nothing but event_queue.put. The lock-free design is correct and a lock would add nothing. The invariant to carry is that all mutable UI state is confined to one thread and the queue is the only shared object - a port must re-establish that explicitly rather than read the absence of locks as the absence of a concurrency contract."
      - "Two findings were sharpened by the protocols phase's resolution of the wire encoding. S4.3 now states that the complete pixel content of every page travels base64'd over unauthenticated plaintext HTTP - not merely 'a request is made'. S4.5's TOCTOU window is now known to extend to base64 encode time, per page, because the client re-reads the file at request time."
      - "Two structural themes for porting: absent bounds (no job timeout, output cap, input cap, queue bound, per-drain budget, or temp-space check) and errors that misdirect (S5.1, S5.2, S5.3, D2.10 are one weakness in four places - the app asserts causes it has not established, which is what convention C03 exists to prevent)."
      - "The real security exposure is untrusted binary parsing (pymupdf.open, Image.open) with no size limit and PyMuPDF uncapped - not the network. Verified clean: no secrets anywhere, and no command-injection path, with all six OS branches covered by passing tests."
    outputs_present:
      - findings/defect-scan-semantic/semantic-defects.md
    open_questions: []
    carry_forward: []
  porting:
    status: complete
    owner_notes:
      - "Completed via codecarto_complete."
      - "Primary output: .codecarto/findings/porting/reverse-engineering-bundle.md"
      - "Validation: PASS"
      - "Synthesized all five upstream artifacts into a self-sufficient bundle. No new source reading was needed beyond confirming the four decisions, which is the compression boundary working as intended."
      - "All 41 defects (4 high, 16 medium, 21 low) carry a disposition and a required design consequence; each high finding also carries a sketched acceptance test, per the deep-audit guidance that a hazard without a test gets reintroduced."
      - "Two structural conclusions drive the rewrite. The system has no notion of partial success - one decision that generates D2.1, D2.2, and half of D2.3's cost. And absent bounds are systemic: no job timeout, output cap, input cap, queue bound, per-drain budget, or free-space check."
      - "The bundle leads with a caveat that shapes how it should be trusted: the specification is two-tier. The 1,069-line service suite passes and its contracts are verified; the ~470 lines of GUI suites error at collection, so 14 of 42 acceptance rows are asserted-not-verified. The GUI is simultaneously the only interactive surface and the least-evidenced half of the spec."
      - "Decision 4 is new relative to the previous run: two acceptance scenarios (41, 42) describe behavior the implementation demonstrably FAILS, both found by execution. They must reach the spec as MUST rules, not observations, because a faithful port would otherwise reproduce both."
      - "Deliberately did NOT reproduce the 42 acceptance scenarios or the full event/state tables. They are named in the Source Index with explicit deep-read triggers and routed as porting-CF3, which also requires carrying the verification-status column forward per convention C04."
    outputs_present:
      - findings/porting/reverse-engineering-bundle.md
    open_questions: []
    carry_forward: []
  reimplementation-spec:
    status: complete
    owner_notes:
      - "Completed via codecarto_complete."
      - "Primary output: .codecarto/findings/reimplementation-spec/reimplementation-spec.md"
      - "Validation: PASS"
      - "Language-agnostic spec, tagged selection: language-agnostic in the front matter. The Strategic Alignment Hook was not answered interactively and the originating request named no target stack, so per GUIDE.md the default template was used and the choices the hook would have elicited are recorded as q-target-stack and q-scope-tier-commitment rather than guessed."
      - "Nine concept modules (M1-M9) with the kernel deliberately buildable without any adapter: M1 orchestrator, M5 state machine, and M9 settings must be testable with no page source, recognizer, writer, or shell present. If they are not, the port boundary is wrong."
      - "44 numbered MUST rules across R1-R10, each traced to a defect disposition or a verified contract and cross-referenced to the acceptance scenario that proves it. All 41 defects are dispositioned - none summarized and dropped."
      - "The spec makes exactly ONE deliberate contract break, and says so in place: R1 replaces the original's tested all-or-nothing discard with partial success, while R1.4 preserves the half worth keeping (never corrupt or destroy the canonical artifact). Only one existing test needs rewording."
      - "Nine scenarios encode behavior the original demonstrably fails or that only execution revealed: A2, A5, A11, A12, A13, A14, A21, A28, A29, plus A31's second half. These are the highest-value rows because a faithful port reproduces every one of them."
      - "Carried the acceptance list's verification-status tiering forward as an Origin column (convention C04). 14 rows are marked A - inherited from GUI tests that error at collection in the original - so they specify intent rather than demonstrated behavior. Dropping that column would have handed an implementer a harness whose weak rows look like its strong ones."
      - "Only three targeted deep reads were needed beyond the bundle, all against triggers the bundle named explicitly. The compression boundary held."
    outputs_present:
      - findings/reimplementation-spec/reimplementation-spec.md
    open_questions:
      -
        id: q-target-stack
        kind: needs-maintainer-decision
        description: "No target language, runtime, UI toolkit, project identity, or module naming was committed, so the Strategic Alignment Hook's inputs are absent and this spec is language-agnostic by default. Concurrency, UI, and packaging rules are stated as requirements rather than concrete techniques."
        deferred_reason: "A product decision the orchestrator owns. Once committed, re-run this phase against templates/reimplementation-spec-opinionated.md - recorded as post-pipeline item pp-opinionated-spec-rerun and carry-forward spec-CF2."
      -
        id: q-scope-tier-commitment
        kind: needs-maintainer-decision
        description: "Which scope tier is the actual target was never stated. The three tiers are defined, but whether the first release is the minimum viable port or major-workflow parity changes sequencing after Phase 8."
        deferred_reason: "Requires the same product decision as q-target-stack."
      -
        id: q-gui-tests-ever-run
        kind: needs-maintainer-decision
        description: "Established that the original's five GUI suites error at collection without the toolkit, so they cannot have passed headless. Whether they pass on a machine with a display - and therefore whether ~470 lines of contracts were ever demonstrated - is unknown, and it sets how far the 14 A-origin acceptance scenarios can be trusted."
        deferred_reason: "Needs a maintainer statement or a host with a display. R10 and scenario A29 make the port immune regardless of the answer."
      -
        id: q-prompt-provenance
        kind: needs-maintainer-decision
        description: "The system prompt drives output quality more than any other setting and is specified as preserve-verbatim, but nothing records how it was derived or against which models it was tuned. A port cannot tell which clauses are load-bearing, so it cannot safely simplify it."
        deferred_reason: "Project history, not source. R8.2's prompt versioning is the mitigation: changes become attributable even while provenance stays unknown."
      -
        id: q-queue-depth-under-load
        kind: needs-runtime-test
        description: "Real steady-state channel occupancy and delta rates against a production-grade model were never measured, so R2's caps and bounds are specified as requirements without numeric thresholds."
        deferred_reason: "Needs a GPU-backed model on a multi-page document, which no pipeline phase performs. Routed to a spike (spec-CF1) to set the constants."
      -
        id: q-ctk-image-clear
        kind: needs-runtime-test
        description: "In the original, clearing a displayed image relies on toolkit-version-dependent null-image behavior, and whether it actually clears was never verified."
        deferred_reason: "Toolkit-specific and largely moot once a stack is chosen: M8 requires explicit clearing rather than a null assignment, so the port does not inherit the ambiguity."
    carry_forward: []
next_actions:
  - "All phases complete. Review findings; post-pipeline skills: codecarto_list_skills / codecarto_skill."
  - "7 open question(s) and 9 post-pipeline item(s) remain — apply resolutions with codecarto_amend (write scratch/amendments/<slug>.yaml from templates/amendment.yaml)."
  - "Publish the finished spec to a library: codecarto_publish (create one with codecarto_library_init; see the library guide topic)."
  - "Dashboard: .codecarto/dashboard.html (refreshed on completion and amendment; codecarto_dashboard re-renders on demand). Usage totals: codecarto_usage."
post_pipeline:
  -
    id: pp-run-gui-suites
    description: "Run the five GUI test suites on a host with tkinter and a display to resolve q-gui-tests-ever-run. They error at collection here, so it is established they cannot have passed headless; whether they pass anywhere is unknown. Determines how far the 14 asserted-not-verified acceptance rows can be trusted."
    source_phase: porting
    status: pending
  -
    id: pp-fix-gui-skip-guard
    description: "Fix the headless-skip guard in the five GUI suites (D1.6): guard the import with importlib.util.find_spec('tkinter') plus a module-level skipUnless, or move 'import app' inside the existing try in setUp. Independent of any port and worth doing in the Python codebase directly - it is what hid ~470 lines of unverified contracts."
    source_phase: porting
    status: pending
  -
    id: pp-measure-queue-depth
    description: "Measure steady-state event-queue depth against a real GPU-backed model on a multi-page document to resolve q-queue-depth-under-load, which decides how urgently a port needs bounded channels (D2.5, S3.2)."
    source_phase: porting
    status: pending
  -
    id: pp-prompt-provenance
    description: "Ask the maintainer to record how SYSTEM_PROMPT was derived and against which models it was tuned (q-prompt-provenance). A port cannot tell which clauses are load-bearing, and it is the highest-leverage setting in the system."
    source_phase: porting
    status: pending
  -
    id: pp-defect-fix-tracker
    description: "If the defects are fixed in the existing Python codebase rather than in a port, instantiate templates/defect-fix-tracker.md with the 41 IDs from the two scan reports to log each fix, deferral, or acceptance."
    source_phase: porting
    status: pending
  -
    id: spec-CF1
    description: "SPIKE - Establish R2's numeric thresholds (per-page and per-document output caps, channel bound, per-cycle observer budget, maximum input page count and byte size) by measuring a real model on real documents. The rules are normative; only the constants are open. Requires executing against a production-grade model, which no pipeline phase performs; guessing the constants would make R2 either toothless or wrong."
    source_phase: reimplementation-spec
    status: pending
  -
    id: spec-CF2
    description: "AMENDMENT - Re-run reimplementation-spec against templates/reimplementation-spec-opinionated.md once a target stack, project identity, module naming, and scope tier are committed, replacing requirement-shaped hazard mitigations with concrete techniques. Blocked on q-target-stack and q-scope-tier-commitment; producing a stack-specific spec now would invent commitments the orchestrator has not made."
    source_phase: reimplementation-spec
    status: pending
  -
    id: spec-CF3
    description: "SPIKE - Prototype the provider adapter against a live server to confirm the complete request envelope beyond image encoding (headers, sibling fields, error-response shapes) so R4's typed error classification maps onto real failures rather than inferred ones. Image encoding is established but no traffic was captured; cheap insurance before Phase 6 substitutes real adapters."
    source_phase: reimplementation-spec
    status: pending
  -
    id: pp-opinionated-spec-rerun
    description: "Orchestrator trigger for spec-CF2: once the stack decision exists, run reimplementation-spec interactively so the Strategic Alignment Hook is actually answered rather than defaulted."
    source_phase: reimplementation-spec
    status: pending
